# GRPO Toy Test Configuration
# Test GRPO training with gpt2-small model

model: gpt2-small

trainer:
  micro_batch_size: 2
  train_batch_size: 4
  gradient_accumulation_steps: 2
  log_interval: 1
  use_flash_attn: true

data:
  config_path: configs/data/grpo_toy.yaml
  task_type: grpo

optim:
  optimizer: adam
  lr_scheduler: cosine
  max_lr: 1.0e-5
  min_lr: 1.0e-6
  warmup_steps: 0
  annealing_steps: 50
  weight_decay: 0.0
  clip_grad: 1.0

operation:
  train_steps: 50
  eval_interval: 25

init:
  seed: 42

alignment:
  method: grpo
  grpo_group_size: 4
  grpo_beta: 0.1
  grpo_eps: 1.0e-8
  generation:
    max_new_tokens: 64
    temperature: 1.0
    top_p: 0.9
    top_k: 0
    do_sample: true
  reward:
    type: math
    num_workers: 4
    timeout: 30
