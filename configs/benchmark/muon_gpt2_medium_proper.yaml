# Muon Optimizer Benchmark: GPT-2 Medium (350M params)
# Using hyperparameters from Moonshot AI paper (arxiv:2502.16982)
# Key insight: With 0.2*sqrt(max(A,B)) scaling, Muon can reuse AdamW hyperparameters

trainer:
  micro_batch_size: 2
  train_batch_size: 128
  gradient_accumulation_steps: 32

  tensor_model_parallel_size: 1

  save_checkpoint_steps: 500
  log_interval: 20
  model_path: models/benchmark_muon_gpt2_medium

  use_flash_attn: true
  vocab_padding_unit: 128

operation:
  train_steps: 2000
  eval_interval: 500
  eval_samples: 100
  activation_recompute: false
  no_save: true

# GPT-2 Medium config
model:
  num_attention_heads: 16
  num_attention_groups: 16
  head_dim: 64
  max_seq_len: 1024
  max_position_embeddings: 1024
  num_layers: 24
  d_model: 1024
  d_ffn: 4096
  untie_embed: false
  reset_position_ids: false
  reset_attention_mask: false
  eod_mask_loss: false
  precision: bf16
  vocab_name_or_path: gpt2
  tokenizer_type: bbpe
  hf_model_type: gpt2
  hf_architecture: GPT2LMHeadModel

data:
  config_path: configs/data/openwebtext_test.yaml
  task_type: pretrain

optim:
  optimizer: muon
  lr_scheduler: cosine

  # Paper uses 4.2e-4 peak LR with 0.2 scaling factor
  # This matches AdamW's typical update RMS of 0.2-0.4
  max_lr: 0.00042
  min_lr: 0.000042

  warmup_steps: 500
  annealing_steps: 2000

  # Weight decay is CRITICAL for large-scale training
  # Prevents weight RMS from growing beyond bf16 precision range
  weight_decay: 0.1

  muon_momentum: 0.95
  muon_newton_schulz_steps: 5

  # AdamW settings for non-Muon parameters (embeddings, biases, norms)
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-8

  clip_grad: 1.0

init:
  seed: 42
  init_std: 0.02

parallel:
  use_distributed_optimizer: true

utils:
  tensorboard_dir: logs/tensorboard/muon_gpt2_medium_proper
