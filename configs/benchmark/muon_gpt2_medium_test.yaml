# Muon Optimizer Test: GPT-2 Medium (350M params)
# 500 steps, 1024 seq length, 2 GPU test

trainer:
  micro_batch_size: 2
  train_batch_size: 128
  gradient_accumulation_steps: 32

  tensor_model_parallel_size: 1

  save_checkpoint_steps: 500
  log_interval: 20
  model_path: models/benchmark_muon_gpt2_medium

  use_flash_attn: true
  vocab_padding_unit: 128

operation:
  train_steps: 500
  eval_interval: 500
  eval_samples: 100
  activation_recompute: false
  no_save: true

# GPT-2 Medium config
model:
  num_attention_heads: 16
  num_attention_groups: 16
  head_dim: 64
  max_seq_len: 1024
  max_position_embeddings: 1024
  num_layers: 24
  d_model: 1024
  d_ffn: 4096
  untie_embed: false
  reset_position_ids: false
  reset_attention_mask: false
  eod_mask_loss: false
  precision: bf16
  vocab_name_or_path: gpt2
  tokenizer_type: bbpe
  hf_model_type: gpt2
  hf_architecture: GPT2LMHeadModel

data:
  config_path: configs/data/openwebtext_test.yaml
  task_type: pretrain

optim:
  optimizer: muon
  lr_scheduler: cosine

  # Match reference implementation's learning rate
  max_lr: 0.01
  min_lr: 0.001

  warmup_steps: 100
  annealing_steps: 500

  weight_decay: 0.1

  muon_momentum: 0.95
  muon_newton_schulz_steps: 5
  muon_lr_scale: 1.0

  # Match reference implementation's AdamW settings
  adam_beta1: 0.8
  adam_beta2: 0.95
  adam_eps: 1.0e-10

  clip_grad: 1.0

init:
  seed: 42
  init_std: 0.02

parallel:
  use_distributed_optimizer: true

utils:
  tensorboard_dir: logs/tensorboard/muon_gpt2_medium
