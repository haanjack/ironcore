# AdamW Baseline: GPT-2 Medium
# mbs=4, gbs=128, 500 steps, 2 GPUs with DistributedOptimizer

trainer:
  micro_batch_size: 2
  train_batch_size: 128
  gradient_accumulation_steps: 32
  tensor_model_parallel_size: 1
  save_checkpoint_steps: 500
  log_interval: 20
  model_path: models/verify_adamw
  use_flash_attn: true
  vocab_padding_unit: 128

operation:
  train_steps: 500
  eval_interval: 500
  eval_samples: 100
  activation_recompute: false
  no_save: true

model:
  num_attention_heads: 16
  num_attention_groups: 16
  head_dim: 64
  max_seq_len: 1024
  max_position_embeddings: 1024
  num_layers: 24
  d_model: 1024
  d_ffn: 4096
  untie_embed: false
  reset_position_ids: false
  reset_attention_mask: false
  eod_mask_loss: false
  precision: bf16
  vocab_name_or_path: gpt2
  tokenizer_type: bbpe
  hf_model_type: gpt2
  hf_architecture: GPT2LMHeadModel

data:
  config_path: configs/data/openwebtext_test.yaml
  task_type: pretrain

optim:
  optimizer: adam
  lr_scheduler: cosine
  max_lr: 0.00042
  min_lr: 0.000042
  warmup_steps: 50
  annealing_steps: 500
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-8
  clip_grad: 1.0

init:
  seed: 42
  init_std: 0.02

parallel:
  use_distributed_optimizer: true

utils:
  report_memory_usage: true
  tensorboard_dir: logs/tensorboard/verify_adamw
