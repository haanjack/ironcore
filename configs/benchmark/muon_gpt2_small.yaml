# Muon Optimizer Benchmark: GPT-2 Small (124M params)
# 1000 steps training with 2048 sequence length

trainer:
  micro_batch_size: 4
  train_batch_size: 512
  gradient_accumulation_steps: 128

  tensor_model_parallel_size: 1

  save_checkpoint_steps: 1000
  log_interval: 10
  model_path: models/benchmark_muon_gpt2_small

  use_flash_attn: true
  vocab_padding_unit: 128

operation:
  train_steps: 1000
  eval_interval: 500
  eval_samples: 100
  activation_recompute: false
  no_save: true

# Inline model config for GPT-2 Small
model:
  num_attention_heads: 12
  num_attention_groups: 12
  head_dim: 64
  max_seq_len: 2048
  max_position_embeddings: 2048
  num_layers: 12
  d_model: 768
  d_ffn: 3072
  untie_embed: false
  reset_position_ids: false
  reset_attention_mask: false
  eod_mask_loss: false
  precision: bf16
  vocab_name_or_path: gpt2
  tokenizer_type: bbpe
  hf_model_type: gpt2
  hf_architecture: GPT2LMHeadModel

# Inline data config for benchmark
data:
  vocab_name_or_path: gpt2
  tokenizer_type: bbpe
  seq_length: 2048
  splits: [0.99, 0.01, 0.0]
  train_datasets:
    - name: openwebtext_benchmark
      dataset_path: openwebtext
      task_type: pretrain
      ratio: 1.0
      split: train
      text_column: text
      max_samples: 200000
  preprocessed_dir: ./data/preprocessed
  cache_dir: ./data/cache
  num_workers: 8

optim:
  optimizer: muon
  lr_scheduler: cosine

  # Muon typically uses higher learning rate than AdamW
  max_lr: 0.02
  min_lr: 0.002

  warmup_steps: 50
  annealing_steps: 1000

  weight_decay: 0.1

  # Muon-specific parameters
  muon_momentum: 0.95
  muon_newton_schulz_steps: 5
  muon_lr_scale: 1.0

  # AdamW parameters (for non-Muon params)
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-8

  clip_grad: 1.0

init:
  seed: 42
  init_std: 0.02
