# Remediation workload: FP32 stored weights, BF16 compute.
d_model: 384
d_ffn: 1024
num_layers: 8
num_attention_heads: 6
num_attention_groups: 6
head_dim: 64
max_seq_len: 2048
max_position_embeddings: 2048
precision: bfloat16
ln_type: rmsnorm
ln_eps: 1.0e-05
activation_type: swiglu
positional_embedding:
  type: rope
untie_embed: true
dropout_embd: 0.0
dropout_attn: 0.0
dropout_mlp: 0.0
bias:
  q: false
  k: false
  v: false
  o: false
  gate: false
  up: false
  down: false
vocab_name_or_path: gpt2
tokenizer_type: bbpe
moe:
  use_moe: true
  num_shared_experts: 1
  num_routed_experts: 4
  num_experts_per_token: 2
  expert_intermediate_size: 256
  aux_loss_alpha: 0.01
  router_dtype: float32
  expert_model_parallel_size: 1
  expert_backend: batched
