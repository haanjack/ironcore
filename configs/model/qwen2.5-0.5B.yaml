num_attention_heads: 14
num_attention_groups: 2
attention_head_size: 64
head_dim: 64
max_seq_len: 32768
num_layers: 24
d_model: 896
d_ffn: 4864
untie_embed: false
reset_position_ids: false
reset_attention_mask: false
eod_mask_loss: false
precision: bf16

vocab_name_or_path: Qwen/Qwen2.5-0.5B-Instruct
# "sentencepiece" selects the generic AutoTokenizer.from_pretrained path, which is what
# Qwen's BPE vocab needs — the value is a router key, not a claim about the algorithm.
tokenizer_type: sentencepiece

hf_model_type: qwen2
hf_architecture: Qwen2ForCausalLM

ln_type: rmsnorm
ln_eps: 1.0e-6
positional_embedding:
  type: rope
  base: 10_000

# Qwen2.5 biases the attention QKV projections only; GQA follows from
# num_attention_groups < num_attention_heads.
bias:
  q: true
  k: true
  v: true
  o: false
  gate: false
  up: false
  down: false
