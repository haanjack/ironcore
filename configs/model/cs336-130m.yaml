# CS336-style LM: actual count 130,433,920 with the padded GPT-2 vocabulary.
d_model: 640
d_ffn: 1792
num_layers: 13
num_attention_heads: 10
num_attention_groups: 10
head_dim: 64
max_seq_len: 1024
max_position_embeddings: 1024
precision: bfloat16
ln_type: rmsnorm
ln_eps: 1.0e-5
activation_type: swiglu
positional_embedding:
  type: rope
untie_embed: true
dropout_embd: 0.0
dropout_attn: 0.0
dropout_mlp: 0.0
bias:
  q: false
  k: false
  v: false
  o: false
  gate: false
  up: false
  down: false
vocab_name_or_path: gpt2
tokenizer_type: bbpe
