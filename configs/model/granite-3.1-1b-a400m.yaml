# IBM Granite 3.1 MoE: 1.334B total, 32 experts, natural top-8 routing.
name: granitemoe
hf_model_type: granitemoe
hf_architecture: GraniteMoeForCausalLM
d_model: 1024
d_ffn: 512
num_layers: 24
num_attention_heads: 16
num_attention_groups: 8
head_dim: 64
max_seq_len: 512
max_position_embeddings: 131072
precision: bfloat16
ln_type: rmsnorm
ln_eps: 1.0e-6
layernorm_bias: false
activation_type: swiglu
untie_embed: false
reset_attention_mask: false
reset_position_ids: false
dropout_attn: 0.0
dropout_mlp: 0.0
dropout_embd: 0.0
positional_embedding:
  type: rope
  base: 1500000
bias:
  q: false
  k: false
  v: false
  o: false
  gate: false
  up: false
  down: false
kv_cache:
  enabled: false
vocab_name_or_path: ibm-granite/granite-3.1-1b-a400m-instruct
tokenizer_type: sentencepiece
granitemoe:
  embedding_multiplier: 12.0
  attention_multiplier: 0.015625
  residual_multiplier: 0.22
  logits_scaling: 6.0
moe:
  use_moe: true
  num_shared_experts: 0
  num_routed_experts: 32
  num_experts_per_token: 8
  expert_intermediate_size: 512
  aux_loss_alpha: 0.0
  expert_backend: grouped
  expert_accumulation_precision: float32  # HF grouped top-k sum; BF16 output.
  grouped_token_budget: 4096
