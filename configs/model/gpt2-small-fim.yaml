num_attention_heads: 12
num_attention_groups: 12
attention_head_size: 64
head_dim: 64
max_seq_len: 1024
num_layers: 12
d_model: 768
d_ffn: 3072
untie_embed: false
reset_position_ids: false
reset_attention_mask: false
eod_mask_loss: false
precision: bf16

# Tokenizer with FIM special tokens (vocab size: 50260)
# Token IDs: <fim_prefix>=50257, <fim_suffix>=50258, <fim_middle>=50259
vocab_name_or_path: ./tokenizers/gpt2-fim
tokenizer_type: bbpe

# FIM token definitions (must match tokenizer vocabulary)
# These tokens must exist in the tokenizer for FIM training
fim_tokens:
  prefix: "<fim_prefix>"
  suffix: "<fim_suffix>"
  middle: "<fim_middle>"

# HuggingFace/vLLM compatibility
hf_model_type: gpt2
hf_architecture: GPT2LMHeadModel
