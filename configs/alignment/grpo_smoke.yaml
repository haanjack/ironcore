# GRPO Smoke Test Configuration
# For behavioral convergence validation with Qwen-2.5-0.5B

model:
  type: qwen2
  name: Qwen/Qwen2.5-0.5B
  d_model: 896
  num_layers: 24
  num_attention_heads: 14
  num_key_value_heads: 2
  d_ff: 4864
  max_position_embeddings: 512
  rope_theta: 1000000
  rms_norm_eps: 1.0e-6
  tie_word_embeddings: true
  positional_embedding:
    type: rope
    scaling_factor: 1.0

tokenizer:
  type: qwen2
  name: Qwen/Qwen2.5-0.5B
  padding_side: left

data:
  train_file: data/golden_task_train.jsonl
  eval_file: data/golden_task_eval.jsonl
  train_batch_size: 4
  eval_batch_size: 4
  num_workers: 0

alignment:
  method: grpo
  grpo_group_size: 4
  grpo_beta: 0.1
  grpo_eps: 1.0e-8

  generation:
    max_new_tokens: 32
    temperature: 1.0
    top_p: 0.9
    top_k: 0
    do_sample: true

  reward:
    type: math
    num_workers: 2
    timeout: 10

trainer:
  optimizer: adamw
  learning_rate: 1.0e-5
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  clip_grad: 1.0
  train_batch_size: 4
  gradient_accumulation_steps: 1
  tensor_model_parallel_size: 1
  fp16: false
  bf16: true

operation:
  train_steps: 100
  eval_interval: 25
  log_interval: 5
  save_interval: 50
  checkpoint_dir: checkpoints/grpo_smoke

parallel:
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1
  data_parallel_size: 1

init:
  seed: 42
  method: normal
  std: 0.02
