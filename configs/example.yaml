# IronCore Quick Example
# Runs on 1 GPU with random data — no preprocessing required.
#
# Usage:
#   ironcore train --config configs/example.yaml
#   torchrun -m ironcore.train --config configs/example.yaml

trainer:
  micro_batch_size: 4
  train_batch_size: 8
  gradient_accumulation_steps: 2
  tensor_model_parallel_size: 1
  save_checkpoint_steps: 1000
  log_interval: 2
  model_path: outputs/example
  use_flash_attn: true
  vocab_padding_unit: 128

operation:
  train_steps: 10
  eval_interval: 5
  eval_samples: 10
  activation_recompute: false
  no_save: true

model: gpt2-small

data:
  task_type: pretrain
  use_mock_data: true

optim:
  optimizer: adam
  lr_scheduler: cosine
  max_lr: 6.0e-4
  min_lr: 6.0e-5
  warmup_steps: 2
  annealing_steps: 10
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-8
  clip_grad: 1.0

init:
  seed: 42
  init_std: 0.02
