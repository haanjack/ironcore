# CP2 causal pretraining smoke. Mock tokens check systems behavior, not model quality.
# Run with torchrun --standalone --nproc_per_node=2 -m ironcore train --config <this-file>.
model: smollm2-135m
trainer:
  model_name: smollm2-135m-cp2
  model_path: /tmp/ironcore-smollm2-135m-cp2
  load_from_hf: HuggingFaceTB/SmolLM2-135M
  tensor_model_parallel_size: 1
  context_parallel_size: 2
  context_parallel_backend: ring
  micro_batch_size: 1
  train_batch_size: 2
  gradient_accumulation_steps: 2
  parameter_precision: float32
  use_flash_attn: false  # CP ring uses PyTorch's native FlashAttention directly.
  recompute_linear_ce: true
  loss_chunk_size: 128
  save_checkpoint_steps: 3
  log_interval: 1
  num_workers: 0
operation:
  train_steps: 3
  save_full_model: true
  save_dist_ckpt: false
  activation_recompute: true
  recompute_strategy: standard
data:
  task_type: pretrain
  use_mock_data: true
  seq_length: 8192
  vocab_name_or_path: HuggingFaceTB/SmolLM2-135M
optim:
  optimizer: adam
  max_lr: 0.0001
  min_lr: 0.0001
  annealing_steps: 6
  clip_grad: 1.0
init:
  seed: 42
