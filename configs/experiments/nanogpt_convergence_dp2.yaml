# nanoGPT convergence — GPT-2 small (124M) on OpenWebText, 2-GPU DP + torch.compile
#
# DP=2: micro_batch=6 per GPU, grad_accum=40, global_batch=480 seqs
# Tokens/step: 480 × 1024 = 491,520 (same as nanoGPT reference)
#
# Reference val loss (OpenWebText, same 99/1 split):
#   ~3.3 @ 1k steps  (~500M tokens)
#   ~3.0 @ 10k steps (~5B tokens)
#   ~2.9 @ 50k steps (~25B tokens)
#   ~2.85 @ convergence (200k+ steps)

trainer:
  micro_batch_size: 12
  train_batch_size: 480
  gradient_accumulation_steps: 20
  tensor_model_parallel_size: 1
  model_path: outputs/nanogpt_convergence_dp2
  save_checkpoint_steps: 1000
  log_interval: 10
  use_flash_attn: true
  vocab_padding_unit: 128
  compile_model: true
  compile_dynamic: true
  do_eval: true

operation:
  train_steps: 10000
  eval_interval: 500
  eval_samples: 500
  activation_recompute: false

model:
  name: nanogpt
  config-path: configs/model/nanogpt-small.yaml

data:
  config_path: configs/data/nanogpt_owt.yaml
  task_type: pretrain

optim:
  optimizer: adam
  lr_scheduler: cosine
  max_lr: 6.0e-4
  min_lr: 6.0e-5
  warmup_steps: 2000
  annealing_steps: 600000
  weight_decay: 0.1
  no_decay_on_embedding: false
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-8
  clip_grad: 1.0

init:
  seed: 1337
  init_std: 0.02

utils:
  wandb_project: ironcore
  wandb_name: nanogpt-small-owt-dp2
