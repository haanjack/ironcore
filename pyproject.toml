[project]
name = "ironcore"
version = "0.1.0"
description = "Distributed training framework"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "pyyaml",
    "tiktoken",
    "datasets",
    "einops",
    "huggingface_hub",
    "numpy",
    "pandas",
    "pyarrow",
    "python-dotenv",
    "safetensors",
    "tabulate",
    "tensorboard",
    "tqdm",
    "transformers>=4.30.0",
]

[project.optional-dependencies]
dev = ["pylint", "pytest"]
dsl = ["triton>=3.0.0"]

# AI provider dependencies for kernel generation
generate-anthropic = ["anthropic>=0.40.0"]
generate-openai = ["openai>=1.0.0"]
generate-glm = ["zhipuai>=2.0.0"]

# Bundle all generation dependencies
generate = [
    "ironcore[dsl]",
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "zhipuai>=2.0.0",
    "jinja2>=3.1.0",
]

[project.scripts]
ironcore = "ironcore.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ironcore*", "experiments*"]

[tool.pylint.'MESSAGE CONTROL']
disable = ["missing-module-docstring",
           "missing-class-docstring",
           "missing-function-docstring",
           "too-many-instance-attributes",
           "too-many-arguments",
           "protected-access",
           "line-too-long",
           "arguments-differ",
           "fixme"
]