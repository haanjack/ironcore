[project]
name = "ironcore"
version = "0.1.0"
description = "Distributed training framework"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
    "torch",
    "pyyaml",
    "tiktoken",
    "datasets",
    "einops",
    "huggingface_hub",
    "numpy",
    "pandas",
    "psutil>=5.9",
    "pyarrow",
    "python-dotenv",
    "safetensors",
    "tabulate",
    "tensorboard",
    "tqdm",
    "transformers>=4.30.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-timeout", "ruff"]

[project.scripts]
ironcore = "ironcore.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ironcore*"]

[tool.ruff]
# Configuration for static analysis and formatting
target-version = "py312"
line-length = 100
src = ["ironcore", "tests", "examples"]

[tool.ruff.lint]
# Combined rules for comprehensive checking
# F: Pyflakes, E/W: pycodestyle, I: isort, B: flake8-bugbear
# C90: McCabe complexity, UP: pyupgrade, N: pep8-naming, PL: Pylint compatibility
select = ["F", "E", "W", "I", "B", "C90", "UP", "N", "PL"]

ignore = [
    "E501",    # Line length
    "C901",    # Function complexity
    "UP007",   # Union type (X | Y)
    "N806",    # Variable naming in function
    "N812",    # Lowercase functional imported as non-lowercase F
    "N817",    # CamelCase DDP imported as acronym DDP
    "B007",    # Loop variable used in function definition
    "B904",    # Raise from err
    "PLC0415", # Allow imports inside functions (Lazy loading)
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments
    "PLR0915", # Too many statements
    "PLR2004", # Magic value used in comparison
    "PLR5501", # Allow else: if: instead of elif:
    "PLW0603", # Using global statement
    "PLW2901", # Overwritten for loop variable
]

# Keep unused imports for manual cleanup to avoid breaking logic accidentally
extend-unsafe-fixes = [
    "F401",    # Unused imports
    "F841",    # Unused variables
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
known-first-party = ["ironcore"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -m 'not e2e' --strict-markers --ignore=tests/unit/profiler/ --ignore=tests/multi_gpu/"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "cuda: Tests requiring CUDA/GPU; conftest auto-skips if no GPU available",
    "mp: Tests requiring Model Parallel (2+ GPUs, torchrun); conftest auto-skips if <2 GPUs",
    "hf_hub: Tests that download from HuggingFace Hub (network); excluded from CPU CI",
    "e2e: Expensive end-to-end tests running full subprocess/torchrun (~10 min); opt-in only",
    "smoke: Pipeline liveness check — a few steps to confirm nothing crashes",
    "pretrain: Pre-training LM pipeline",
    "sft: Supervised fine-tuning pipeline",
    "dpo: DPO alignment pipeline",
    "grpo: GRPO online RL pipeline (rollout, reward, advantage, policy update)",
    "checkpointing: Checkpoint save/load — native, HF interop, distributed",
]