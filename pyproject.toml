[project]
name = "ironcore"
version = "0.1.0"
description = "Distributed training framework"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "torch",
    "pyyaml",
    "tiktoken",
    "datasets",
    "einops",
    "huggingface_hub",
    "numpy",
    "pandas",
    "pyarrow",
    "python-dotenv",
    "safetensors",
    "tabulate",
    "tensorboard",
    "tqdm",
    "transformers>=4.30.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
ironcore = "ironcore.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ironcore*"]

[tool.ruff]
# Configuration for static analysis and formatting
target-version = "py312"
line-length = 100
src = ["ironcore", "tests", "examples"]

[tool.ruff.lint]
# Combined rules for comprehensive checking
# F: Pyflakes, E/W: pycodestyle, I: isort, B: flake8-bugbear
# C90: McCabe complexity, UP: pyupgrade, N: pep8-naming, PL: Pylint compatibility
select = ["F", "E", "W", "I", "B", "C90", "UP", "N", "PL"]

ignore = [
    "E501",    # Line length
    "C901",    # Function complexity
    "UP007",   # Union type (X | Y)
    "N806",    # Variable naming in function
    "N812",    # Lowercase functional imported as non-lowercase F
    "N817",    # CamelCase DDP imported as acronym DDP
    "B007",    # Loop variable used in function definition
    "B904",    # Raise from err
    "PLC0415", # Allow imports inside functions (Lazy loading)
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments
    "PLR0915", # Too many statements
    "PLR2004", # Magic value used in comparison
    "PLR5501", # Allow else: if: instead of elif:
    "PLW0603", # Using global statement
    "PLW2901", # Overwritten for loop variable
]

# Keep unused imports for manual cleanup to avoid breaking logic accidentally
extend-unsafe-fixes = [
    "F401",    # Unused imports
    "F841",    # Unused variables
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
known-first-party = ["ironcore"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -m 'not rlvr' --ignore=tests/unit/profiler/ --ignore=tests/integration/kvcache/test_kv_cache_tp2.py --ignore=tests/integration/attention/test_tp_comparison_simple.py --ignore=tests/integration/lora/test_lora_tp_correctness.py"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "unit: Fast, isolated unit tests",
    "integration: Tests involving multiple components",
    "performance: Benchmark and stress tests",
    "slow: Tests that take >1s to run",
    "tp1: Tensor parallel tests with TP=1",
    "tp2: Tensor parallel tests with TP=2",
    "cuda: Tests that require CUDA",
    "kv_cache: KV cache related tests",
    "paged_attention: Paged attention tests",
    "prefix_cache: Prefix cache tests",
    "rlvr: RLVR training smoke tests: GRPO + verifiable rewards, 2 GPUs, ~10 min",
]