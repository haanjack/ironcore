name: Lint and Format Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ruff-lint:
    name: Linting
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          # Explicitly install ruff for fast linting without heavy dependencies.
          # Pinned: an unpinned ruff turns every new release into a CI failure on
          # code that did not change — 998cec9 passed on 2026-06-14 and failed at
          # the same commit once 0.16 shipped new rules and formatter output.
          # Keep in sync with the dev extra in pyproject.toml.
          pip install ruff==0.15.17

      - name: Run Ruff Check
        run: |
          # Provides inline annotations in GitHub PRs
          ruff check --output-format=github

      - name: Run Ruff Format Check
        run: |
          # Ensures code adheres to formatting standards
          ruff format --check
