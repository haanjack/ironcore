name: Lint and Format Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ruff-lint:
    name: Linting
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          # Pinned: an unpinned ruff means a new release can turn CI red on an
          # unchanged tree, which is exactly what happened with 0.15.17 -> 0.16.x
          # (new PLR0917 rule plus formatter style changes).
          pip install ruff==0.15.17

      - name: Run Ruff Check
        run: |
          # Provides inline annotations in GitHub PRs
          ruff check --output-format=github

      - name: Run Ruff Format Check
        run: |
          # Ensures code adheres to formatting standards
          ruff format --check
