name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode to run'
        required: true
        default: 'cpu'
        type: choice
        options: [cpu, gpu, distributed, e2e, all]

jobs:
  # Logic/CPU tests — runs on every PR and push to main
  logic-tests:
    name: Logic Tests
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.test_mode == 'cpu' || github.event.inputs.test_mode == 'all'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run logic tests (CPU, no network)
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: |
          pytest tests/ \
            -m "not cuda and not mp and not e2e and not hf_hub" \
            -v --tb=short -q

  # Single-GPU tests — runs on every PR and push to main
  gpu-tests:
    name: GPU Tests
    runs-on: [self-hosted, gpu, mp]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.test_mode == 'gpu' || github.event.inputs.test_mode == 'all'))

    steps:
      - name: Checkout repository
        run: |
          git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
          if [ ! -d .git ]; then
            git clone https://github.com/${{ github.repository }}.git .
          fi
          git fetch origin ${{ github.sha }}
          git checkout ${{ github.sha }}
          git clean -fd

      - name: Install dependencies
        run: python3 -m pip install -e ".[dev]" -q

      - name: Run single-GPU tests
        run: |
          pytest tests/ \
            -m "cuda and not mp and not e2e" \
            --tb=short -v -q

  # Multi-GPU distributed tests — push to main and manual dispatch only (not PR)
  distributed-tests:
    name: Distributed Tests
    runs-on: [self-hosted, gpu, mp]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.test_mode == 'distributed' || github.event.inputs.test_mode == 'all'))

    steps:
      - name: Checkout repository
        run: |
          git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
          if [ ! -d .git ]; then
            git clone https://github.com/${{ github.repository }}.git .
          fi
          git fetch origin ${{ github.sha }}
          git checkout ${{ github.sha }}
          git clean -fd

      - name: Install dependencies
        run: python3 -m pip install -e ".[dev]" -q

      - name: Run distributed tests (torchrun per file)
        run: |
          for f in \
            tests/integration/attention/test_attention_multi_gpu.py \
            tests/integration/kvcache/test_kv_cache.py \
            tests/integration/lora/test_lora_async.py \
            tests/integration/lora/test_lora_checkpoint.py \
            tests/integration/lora/test_lora_correctness.py \
            tests/integration/optimizer/test_optimizer.py \
            tests/multi_gpu/test_expert_parallel.py \
            tests/multi_gpu/test_grad_norm.py \
            tests/multi_gpu/test_all_to_all_ep.py \
            tests/multi_gpu/test_distributed_optimizer.py \
            tests/multi_gpu/test_distributed_optimizer_checkpoint.py; do
            if [ -f "$f" ]; then
              torchrun --nproc_per_node=2 -m pytest "$f" -m "mp" -v --tb=short -q
            fi
          done

  # E2E smoke tests — manual dispatch only (~10 min per test, 2 GPUs)
  e2e-tests:
    name: E2E Tests
    runs-on: [self-hosted, gpu, mp]
    if: |
      github.event_name == 'workflow_dispatch' && (github.event.inputs.test_mode == 'e2e' || github.event.inputs.test_mode == 'all')

    steps:
      - name: Checkout repository
        run: |
          git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
          if [ ! -d .git ]; then
            git clone https://github.com/${{ github.repository }}.git .
          fi
          git fetch origin ${{ github.sha }}
          git checkout ${{ github.sha }}
          git clean -fd

      - name: Install dependencies
        run: python3 -m pip install -e ".[dev]" -q

      - name: Run E2E tests (tests self-spawn torchrun internally)
        run: |
          pytest tests/ -m "e2e" -v --tb=short
