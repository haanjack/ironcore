name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode to run'
        required: true
        default: 'cpu'
        type: choice
        options: [cpu, gpu, distributed, e2e, all]

jobs:
  # Logic/CPU tests — runs on every PR and push to main
  logic-tests:
    name: Logic Tests
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.test_mode == 'cpu' || github.event.inputs.test_mode == 'all'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run logic tests (CPU, no network)
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: |
          pytest tests/ \
            -m "not cuda and not mp and not e2e and not hf_hub" \
            -v --tb=short -q

  # Single-GPU tests — runs on every PR and push to main
  gpu-tests:
    name: GPU Tests
    runs-on: [self-hosted, gpu]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.test_mode == 'gpu' || github.event.inputs.test_mode == 'all'))

    steps:
      - name: Checkout repository
        run: |
          # Authenticate per fetch rather than via `git config --global`, which
          # writes the ephemeral token into the runner account's ~/.gitconfig.
          # These runners are persistent, so that rewrite outlives the job and
          # hijacks every later git operation by that user — including ones
          # unrelated to CI — until the token expires and they all 403.
          AUTH_URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if [ ! -d .git ]; then
            git init -q .
            git remote add origin "https://github.com/${{ github.repository }}.git"
          fi
          git fetch --no-tags "$AUTH_URL" ${{ github.sha }}
          git checkout --detach FETCH_HEAD
          git clean -fd

      - name: Build docker image (skips if unchanged)
        run: bash scripts/docker/build.sh

      - name: Run single-GPU tests
        run: bash scripts/docker/launch.sh bash scripts/run_gpu_tests.sh

  # Multi-GPU distributed tests.
  #
  # NO RUNNER CURRENTLY SERVES THE `mp` POOL. The 2-GPU box was withdrawn because
  # its memory is committed to other work, and the single-GPU runner cannot take
  # its place: RCCL refuses two ranks on one device ("Duplicate GPU detected").
  #
  # This is deliberately left as workflow_dispatch only rather than pointed at a
  # runner that would skip everything and report green. A job that queues until
  # someone registers an `mp` runner is honest about the gap; a green check that
  # ran nothing is not — see docs/ci_cd_guide.md.
  distributed-tests:
    name: Distributed Tests
    runs-on: [self-hosted, mp]
    if: |
      github.event_name == 'workflow_dispatch' && (github.event.inputs.test_mode == 'distributed' || github.event.inputs.test_mode == 'all')

    steps:
      - name: Checkout repository
        run: |
          # Authenticate per fetch rather than via `git config --global`, which
          # writes the ephemeral token into the runner account's ~/.gitconfig.
          # These runners are persistent, so that rewrite outlives the job and
          # hijacks every later git operation by that user — including ones
          # unrelated to CI — until the token expires and they all 403.
          AUTH_URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if [ ! -d .git ]; then
            git init -q .
            git remote add origin "https://github.com/${{ github.repository }}.git"
          fi
          git fetch --no-tags "$AUTH_URL" ${{ github.sha }}
          git checkout --detach FETCH_HEAD
          git clean -fd

      - name: Build docker image (skips if unchanged)
        run: bash scripts/docker/build.sh

      - name: Run distributed tests (torchrun per file)
        run: bash scripts/docker/launch.sh bash scripts/run_distributed_tests.sh

  # E2E smoke tests — manual dispatch only (~10 min per test, 2 GPUs).
  # Same as distributed-tests: needs an `mp` runner, and none is registered.
  e2e-tests:
    name: E2E Tests
    runs-on: [self-hosted, mp]
    if: |
      github.event_name == 'workflow_dispatch' && (github.event.inputs.test_mode == 'e2e' || github.event.inputs.test_mode == 'all')

    steps:
      - name: Checkout repository
        run: |
          # Authenticate per fetch rather than via `git config --global`, which
          # writes the ephemeral token into the runner account's ~/.gitconfig.
          # These runners are persistent, so that rewrite outlives the job and
          # hijacks every later git operation by that user — including ones
          # unrelated to CI — until the token expires and they all 403.
          AUTH_URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if [ ! -d .git ]; then
            git init -q .
            git remote add origin "https://github.com/${{ github.repository }}.git"
          fi
          git fetch --no-tags "$AUTH_URL" ${{ github.sha }}
          git checkout --detach FETCH_HEAD
          git clean -fd

      - name: Build docker image (skips if unchanged)
        run: bash scripts/docker/build.sh

      - name: Run E2E tests (tests self-spawn torchrun internally)
        run: bash scripts/docker/launch.sh bash scripts/run_e2e_tests.sh
